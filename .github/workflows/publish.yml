name: Publish to npm

# GitHub release tags pin the documented CLI version.
# An optional NPM_TOKEN enables npm publication after the complete regression suite.
# Without that secret, the same tagged source remains available through GitHub.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '발행 버전 (예: 0.1.1, 비우면 package.json 의 현재 버전)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_NPM: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Set version (manual dispatch only)
        if: ${{ github.event.inputs.version != '' }}
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: npm version "$INPUT_VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regression tests
        run: npm run selftest

      - name: Publish to npm
        if: ${{ env.HAS_NPM == 'true' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip notice
        if: ${{ env.HAS_NPM != 'true' }}
        run: echo "NPM_TOKEN 미설정, npm publish 건너뜀. Settings > Secrets > Actions 에 NPM_TOKEN 을 추가하세요."
